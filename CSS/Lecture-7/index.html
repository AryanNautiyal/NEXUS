<body>
    <!-- Except static z-index can be used with other positions as for static is by default and others aren't -->

    <!-- Sometimes our elements overlap so we use z-index to determine which element overlaps the other -->

    <!-- If z-index greater then it will overlap other (greater = higher chances to overlap other element) -->

    <!-- If multiple elements are overlapped that's why z-index has many values (kind of like stack elements) -->


    <div class="container">
        <div class="box box1">Box 1</div>
        <div class="box box2">Box 2</div>
        <div class="box box3">Box 3</div>
        <div class="box box4">Box 4</div>
    </div>
</body>
