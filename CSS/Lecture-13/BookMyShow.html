    <title>Document</title>
    <link rel="stylesheet" href="./stylesBookMyShow.css">
</head>
<body>

    <!-- header -->

    <header>

        <div class="head">

            <!-- Logo -->

            <div class="logo">

                <div class="left">

                    <h1>BookMyShow</h1>

                </div>

                <div class="right">

                    <button>Movies</button>
                    
                    <button>Events</button>
                    
                    <button>Sports</button>

                </div>

            </div>

            <!-- Search -->

            <div class="search">

                <input type="text" class="searching" placeholder="Search for Movies, Events and Sports....">
                <button>Search</button>

            </div> 

        </div>

    </header>
