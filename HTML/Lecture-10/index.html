<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- Inline element -->

    <a href="" style="background-color: aqua;">Coder Army</a>
    <a href="" style="background-color: aquamarine;">Money Fame</a>
    <img src="../Lecture-9/tree-imgimg.webp" alt="image" height="50" width="50">
    

    <!-- Block element -->

    <p style="background-color: blue;">Hello Coder Army</p>
    <h1 style="background-color: brown;">Kaise ho sab</h1>

    <!-- Converting block element to inline element -->

    <p style="background-color: blue; display: inline;">Hello Coder Army</p>
    <h1 style="background-color: brown; display: inline;">Kaise ho sab</h1>


    <!-- Most important HTML Tag -->
     <!-- div = Division (as a container) -->
    <div></div>

    <div style="margin-top: 10ch; margin-left: 10cm;">
        <img src="../Lecture-9/array-imgimg.webp" alt="image" height="200" width="200">
        <h1>Rohit Negi CPP</h1>
        <p>He is very good boy. He is a body builder</p>
    </div>
    <!-- So instead of doing or moving them only by one by one to middle or somewhere else we can just use container div to make elements grouped so that they all can be moved or CSS can be applied to container etc,etc. -->


    <!-- Without div tag (looks really weird)-->

    <img src="../Lecture-9/array-imgimg.webp" alt="image" height="200" width="200" style="margin-top: 10ch; margin-left: 10cm;">
        <h1 style="margin-top: 10ch; margin-left: 10cm;">Rohit Negi CPP</h1>
        <p style="margin-top: 10ch; margin-left: 10cm;">He is very good boy. He is a body builder</p>

</body>
</html>



<!-- 

    Inline element 
    
        -- Inline elements in HTML are elements that do not start on a new line and only take up as much width as necessary. They flow along with the surrounding text and other inline elements.

        -- Examples of inline elements:

            <span>
            <a>
            <img>
            <strong>
            <em>
            <b>, <i>, <u>
        
        -- Key points:

        They do not break the flow of content.
        Their width and height depend on their content.
        You can place multiple inline elements on the same line.


    
        Block element

            -- Block elements in HTML are elements that always start on a new line and take up the full width available (by default), stretching out to the left and right as far as they can.

            -- Examples of block elements:

                <div>
                <p>
                <h1>, <h2>, <h3>, etc.
                <ul>, <ol>, <li>
                <form>
                <header>, <footer>, <section>, <article>
            
            -- Key points:

                They start on a new line.
                They take up the full width of their parent container.
                You cannot place other elements next to them on the same line (unless you use CSS to change their display).


-->




<!-- 

                    The <div> (short for "division") tag is one of the most commonly used elements in HTML.
                    It’s a block-level container that groups content for styling, layout, or JavaScript manipulation. 
                    Unlike semantic tags (<header>, <article>, <section>), <div> has no inherent meaning—it’s purely structural.

-->
