

<!-- 
 
    Anchor tag

        -- Anchor tag is used to link to another page or a specific part of the same page

        -- It is defined with the <a> tag

        -- The href attribute specifies the URL of the page the link goes to

        -- The text between the opening and closing <a> tags is the clickable link text
    
-->

<a href="https://www.youtube.com" target="_blank">Youtube</a>

<p> I love coding, I like to play football</p>

<a href="https://www.wikipedia.org">Wikipedia</a>


<!-- 

    Anchor tag attributes
    
        -- href: Specifies the URL of the page the link goes to

        -- target: Specifies where to open the linked document
        
            - _blank: Opens the link in a new tab or window
            - _self: Opens the link in the same frame as it was clicked (default)
            - _parent: Opens the link in the parent frame
            - _top: Opens the link in the full body of the window

        -- title: Provides additional information about the link, displayed as a tooltip on hover

        -- rel: Specifies the relationship between the current document and the linked document, often used for security purposes (e.g., rel="noopener noreferrer")
    
-->
