<!-- 

    Unordered List

        -- Unordered lists are used to group a set of related items in no particular order.
    
-->

<!-- 

<ul>
    <li>Milk</li>

<!-- 

    Ordered List

        -- Ordered lists are used to group a set of related items in a specific order.
    
-->
    
<!-- 

<ol>
    <li>Milk</li>
    <li>Tea</li>
    <li>Paneer</li>
</ol> 

-->

<!-- 

<h1>How to Make Tea</h1>

<ul style="list-style-type: square;">
    <li>Take Water</li>
    <li>Add sugar</li>
    <li>Add chaipatti</li>
    <li>Add milk</li>
    <li>Boil it for 5 min</li>
    <li>Tea is ready</li>
</ul> 

-->

<!-- 

    Attributes of Unordered list
    
        -- style = "list-style-type: {input};"

        -- {input} can be replaced by following values:
            - disc
            - circle
            - square
            - none
        
        -- Default value is disc
            
-->

<!-- 

<h1>How to Make Tea</h1>

<ol type = "">
    <li>Take Water</li>
    <li>Add sugar</li>
    <li>Add chaipatti</li>
    <li>Add milk</li>
    <li>Boil it for 5 min</li>
    <li>Tea is ready</li>
</ol>  

-->


<!-- 

    Attributes of Ordered List

        - type = "{input}"

        -- {input} can be replaced by following values:
            - 1 (default)
            - A
            - a
            - I
            - i

        -- Default value is 1

        -- type attribute is used to specify the type of numbering in ordered lists.

        -- It can be used to change the numbering style of the list items.

-->


<!-- 

<h1>How to Make Tea</h1>

<ol start = "10">
    <li>Take Water</li>
    <li>Add sugar</li>
    <li>Add chaipatti</li>
    <li>Add milk</li>
    <li>Boil it for 5 min</li>
    <li>Tea is ready</li>
</ol>  

-->


<!-- 

    Attributes of Ordered List

        -- start = "{input}"

        -- {input} can be replaced by any number

        -- start attribute is used to specify the starting number of the ordered list

        -- It can be used to change the starting number of the list items

        -- Default value is 1

-->
