<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>User Registration</h2>
    <form>
        <label for="username">Username: </label>
        <input type="text" id="username" placeholder="Enter your username" name="username">

        <br><br>
        
        <label for="emailid">Email Id: </label>
        <input type="email" id="emailid" placeholder="xyz@gmail.com" name="emailid">

        <br><br>
        
        <label for="pass">Password: </label>
        <input type="password" id="pass" placeholder="Enter your password" name="pass">
        
        <br><br>
        
        <!-- Same name as only one can be correct so only one value can be true -->
        <label for="">Gender: </label>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <!-- Value return this value if this radio button is selected when form was submitted -->

        <br><br>

        <input type="checkbox" id="terms" name="agree">
        <label for="terms">I agree to the terms and conditions</label>

        <br><br>

        <button>Register</button>

        
    </form>
    
</body>
</html>
