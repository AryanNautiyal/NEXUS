<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h2>Contact Us</h2>

    <form>

        <label for="fname">Full Name: </label>
        <input type="text" id="fname" placeholder="Enter your name">

        <br><br>

        <label for="emailid">Email:</label>
        <input type="email" id="emailid" name="'emailid" placeholder="abc@gmail.com">

        <br><br>

        <label for="contacts">Phone Number: </label>
        <input type="tel" id="contacts" name="contacts">

        <br><br>

        <label for="messagebox">Message: </label>
        <!-- rows and cols makes the textarea visible box change in size according to rows and cols -->
        <textarea name="messagebox" id="messagebox" rows="25" cols="60"></textarea>

        <br><br>

        <!-- For Password -->

        <label for="password">Password: </label>
        <input type="password" id="password" name="password" placeholder="Enter your password">

        <br><br>

        <button>Send</button>
    </form>
</body>
</html>


<!-- 

    textarea tag

        -- Used to create a multi-line text input field

        -- It allows users to enter larger amounts of text, such as comments or messages

        -- It can be resized by the user, depending on the browser and CSS styles applied

        -- It can be styled using CSS to change its appearance, such as font size, color, and background

        -- It can have attributes like rows and cols to specify the visible size of the textarea

        -- It can be used in forms to collect user input, such as feedback
