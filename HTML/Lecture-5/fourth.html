<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1">
        <thead>
            <tr>
                <th>No</th>
                <th>Full Name</th>
                <th>Position</th>
                <th>Salary</th>
                <th>Type</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Bill Gates</td>
                <td>Microsoft</td>
                <td>$1000</td>
                <td rowspan="4">Company Founder</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Steve Jobs</td>
                <td>Apple</td>
                <td>$2000</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Larry Page</td>
                <td>Google</td>
                <td>$1100</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Mark Zuckerberg</td>
                <td>FB</td>
                <td>$2500</td>
            </tr>
            <!-- Can do using this also but for conclusion in table, table footer is used
            
            <tr>
                <td colspan="3">Total Expense</td>
                <td>$6600</td>
            </tr>
            
            -->
            
            <tfoot>
                <tr>
                    <td colspan="3">Total Expense</td>
                    <td>$8000</td>
                </tr>
            </tfoot>
        </tbody>
    </table>
</body>
</html>
