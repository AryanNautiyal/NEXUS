<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
        <thead> </thead> used to create table headings 
        <tbody> </tbody> used to enter data in table headings
    -->

    <table border="1">
        <!-- border = "1" is used to create a border around the table -->
         <!-- The higher the number the more thick and bold the border is 0 = no border -->
        
        <!-- Using this tag table is made -->

        <thead>
            <!-- Indicates the heading part of the table -->
            <tr>
                <!-- Indicates that we are filling data for a single row (tr = table row) -->
                <th>Name</th>
                <th>Age</th>
                <th>Salary</th>
                <!-- th = table head : indicates the heading for each column in table -->
            </tr>
        </thead>
        <tbody>
            <!-- Indicates body where data will be entered -->
            <tr>
                <td>Rohit</td>
                <td>27</td>
                <td>10000</td>
                <!-- td means table data : means that we are entering data in table -->
                 <!-- th and td helps in differentiating table heading and table data -->
            </tr>
            <tr>
                <td>Mohit</td>
                <td>25</td>
                <td>20000</td>
            </tr>
            <tr>
                <td>Riya</td>
                <td>23</td>
                <td>100000</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
