<!-- colspan="2" merges the cells horizontally for two columns -->

<table border="1">
    <thead>
        <tr>
            <th>Firstname</th>
            <th>Lastname</th>
            <th>Age</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Priya</td>
            <td>Sharma</td>
            <td>24</td>
        </tr>
        <tr>
            <td>Arun</td>
            <td>Singh</td>
            <td>32</td>
            

        </tr>
        <tr>
            <td>Sam</td>
            <td colspan="2">Watson</td>
        </tr>
    </tbody>
</table>
