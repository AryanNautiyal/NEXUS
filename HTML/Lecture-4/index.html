
<!DOCTYPE html>  

<!-- HTML ka 5th version use kar rha hu (only tells the version of the HTML we are using) -->


<html lang="en">

<!-- will write HTML code inside <html> </html> so can say from here onwards our HTML code starts -->

<!-- lang = "en" means the language we have used in our website (using it is our choice can or cannot use it but it's a good habit to use it) -->

<!-- This helps in improving SEO (Search Engine Optimization) as if we write english it will rank our website higher in english, if website uses 2 or more languages write the language which is primarily used  -->

<!-- HTML document start from here and content is in english -->


<head>

<!-- head contains  metadata (data about data) -->

<!-- All the data in head won't be shown in our website, it provides data about the contents used in our body -->


    <meta charset="UTF-8">

    <!-- UTF-8 encoding method, whenever we convert this document to binary or binary to this content in this document we won't use ASCII value we will use UTF-8 -->

    <!-- Very powerful , memory allocation is 1-4 bytes -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!-- width=device-width sets the width of the page to match the width of the device’s screen (like a phone, tablet, or desktop), initial-scale=1.0 sets the initial zoom level when the page is first loaded (1.0 means no zoom).
-->

    <!-- Tells the device width should be made equal to content width as we have noticed how websites in our laptop and that same website in our mobile looks different -->

    <!-- initial scale or zoom should be one so that we do not need to scroll website horizontally in mobile devices to see the content at the right side of the website -->

    <!-- Only vertical scroll in website should be ok. So in short making width of content same as device so it width is large it can be sized down or if small then sized up and zoom should be 1 to avoid horizontal scrolling in the website -->


    <title>Document</title> 

    <!-- Title of our website, displayed outside the website page (above the website page in the tabs block) -->
</head>
<body>
<!-- body contains the main content of the website or content that needs to be showed in our website -->

<!-- Display all the content into website -->
    
<!-- Any code we have written till now will be in body only -->
</body>
</html>
