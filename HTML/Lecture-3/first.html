

<!-- 
 
    Absolute path of an image 
    
        -- Absolute path is the full URL of the image

        -- An absolute path of an image is the complete URL or file path that specifies the exact location of the image on the internet or your computer, starting from the root directory
        
        -- It can point to images in other directories or even on other servers

        <img src="https://www.example.com/images/photo.jpg" alt="Example Image">

        -- It is useful when you want to link to an image hosted on a different server or when you want to ensure the image is always accessible regardless of the current page's location

    Relative path of an image
    
        -- Relative path is the path relative to the current page

        -- A relative path of an image is a URL that points to an image file in relation to the current page's location

        -- It can be used to link to images within the same website or directory structure

        <img src="images/photo.jpg" alt="Example Image">

        -- It is useful for linking to images that are stored in the same directory or a subdirectory of the current page, making it easier to manage links when moving files around
-->
