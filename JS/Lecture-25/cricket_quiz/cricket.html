<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./cricket.css">
</head>
<body>

    <div class="form-container">

        <h1>Cricket Quiz</h1>
            
        <form>

            <label for="first" class="question">1. Who has the most centuries in international cricket?</label>

            <div class="question-container">

                <div class="container">

                    <input type="radio" id="Virat" name="answer1" value="Virat Kohli">
                    <label for="Virat">Virat Kohli</label>

                </div>

                <div class="container">

                    <input type="radio" id="Sachin" name="answer1" value="Sachin Tendulkar">
                    <label for="Sachin">Sachin Tendulkar</label>

                </div>

                <div class="container">

                    <input type="radio" id="Ricky" name="answer1" value="Ricky Ponting">
                    <label for="Ricky">Ricky Ponting</label>

                </div>

                <div class="container">

                    <input type="radio" id="Jacques" name="answer1" value="Jacques Kallis">
                    <label for="Jacques">Jacques Kallis</label>

                </div>
                
            </div>
            
            
            <label for="first" class="question">2. Which country won the first ICC Cricket World Cup?</label>

            <div class="question-container">

                <div class="container">

                    <input type="radio" id="Aus" name="answer2" value="Australia">
                    <label for="Aus">Australia</label>

                </div>

                <div class="container">

                    <input type="radio" id="Eng" name="answer2" value="England">
                    <label for="Eng">England</label>

                </div>

                <div class="container">

                    <input type="radio" id="WI" name="answer2" value="West Indies">
                    <label for="WI">West Indies</label>

                </div>

                <div class="container">

                    <input type="radio" id="In" name="answer2" value="India">
                    <label for="In">India</label>

                </div>
                
            </div>


            <label for="first" class="question">3. Who is known as the 'God of Cricket?</label>

            <div class="question-container">

                <div class="container">

                    <input type="radio" id="VK" name="answer3" value="Virat Kohli">
                    <label for="VK">Virat Kohli</label>

                </div>

                <div class="container">

                    <input type="radio" id="DB" name="answer3" value="Don Bradman">
                    <label for="DB">Don Bradman</label>

                </div>

                <div class="container">

                    <input type="radio" id="MS" name="answer3" value="MS Dhoni">
                    <label for="MS">MS Dhoni</label>

                </div>

                <div class="container">

                    <input type="radio" id="ST" name="answer3" value="Sachin Tendulkar">
                    <label for="ST">Sachin Tendulkar</label>

                </div>
                
            </div>



            <label for="first" class="question">4. What is the highest individual score in ODI cricket?</label>

            <div class="question-container">

                <div class="container">

                    <input type="radio" id="264" name="answer4" value="264">
                    <label for="264">264</label>

                </div>

                <div class="container">

                    <input type="radio" id="200" name="answer4" value="200">
                    <label for="200">200</label>

                </div>

                <div class="container">

                    <input type="radio" id="237" name="answer4" value="237">
                    <label for="237">237</label>

                </div>

                <div class="container">

                    <input type="radio" id="275" name="answer4" value="275">
                    <label for="275">275</label>

                </div>
                
            </div>




            <label for="first" class="question">5. Which bowler has taken the most wickets in Test cricket?</label>

            <div class="question-container">

                <div class="container">

                    <input type="radio" id="MM" name="answer5" value="Muttiah Muralitharan">
                    <label for="MM">Muttiah Muralitharan</label>

                </div>

                <div class="container">

                    <input type="radio" id="SW" name="answer5" value="Shane Warne">
                    <label for="SW">Shane Warne</label>

                </div>

                <div class="container">

                    <input type="radio" id="JA" name="answer5" value="James Anderson">
                    <label for="JA">James Anderson</label>

                </div>

                <div class="container">

                    <input type="radio" id="AK" name="answer5" value="Anil Kumble">
                    <label for="AK">Anil Kumble</label>

                </div>
                
            </div>

            <button type="submit">Submit</button>
        
        </form>

        <div id="result"></div>

        
    </div>



    <script src="./cricket.js"></script>
    
</body>
</html>
