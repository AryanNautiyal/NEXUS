<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AstroVibes - Discover Your Stars</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">
    <h1>AstroVibes</h1>
    <form id="astroForm">
      <input type="text" id="firstName" placeholder="First Name" required />
      <input type="text" id="surname" placeholder="Surname" required />
      <input type="number" id="day" placeholder="Day (1-31)" min="1" max="31" required />
      <select id="month" required>
        <option value="">Select Month</option>
        <option value="1">January</option>
        <option value="2">February</option>
        <option value="3">March</option>
        <option value="4">April</option>
        <option value="5">May</option>
        <option value="6">June</option>
        <option value="7">July</option>
        <option value="8">August</option>
        <option value="9">September</option>
        <option value="10">October</option>
        <option value="11">November</option>
        <option value="12">December</option>
      </select>
      <input type="number" id="year" placeholder="Birth Year" min="1900" max="2025" required />
      <button type="submit">Reveal My Zodiac</button>
    </form>
    <div class="result" id="result"></div>
  </div>

  <script src="./first.js"></script>
</body>
</html>
