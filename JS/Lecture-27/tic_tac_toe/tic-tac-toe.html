<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./tic-tac-toe.css">
</head>
<body>

    <div class="img-container">

        <button class="btn">Player 0</button>

        <img src="https://png.pngtree.com/png-vector/20250429/ourlarge/pngtree-a-cute-boy-football-player-png-image_16139547.png" alt="Image of Player 1">


    </div>
    

    <div class="outerCovering">

        <div class="container">


            <div class="h1-container">

                <h1>Tic Tac Toe</h1>

            </div>

        <div class="tic">

                <div id="0" class="cell"></div>
                <div id="1" class="cell"></div>
                <div id="2" class="cell"></div>
                <div id="3" class="cell"></div>
                <div id="4" class="cell"></div>
                <div id="5" class="cell"></div>
                <div id="6" class="cell"></div>
                <div id="7" class="cell"></div>
                <div id="8" class="cell"></div>

        </div>

        <button type="reset" class="button">Restart Game</button>

        <p id="winningMessage"></p>

        </div>
    </div>

    <div class="img-container">

        <button class="btn">Player 1</button>

        <img src="https://thumbnail.imgbin.com/25/5/17/3d-cartoon-boy-boy-with-soccer-ball-gJEC0W98_t.jpg" alt="Image of Player 2" class="img2">

    
    </div>




    <script src="./tic-tac-toe.js"></script>
    
</body>
</html>
