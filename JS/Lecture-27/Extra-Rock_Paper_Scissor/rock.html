<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./rock.css">

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

</head>
<body>


        <!-- Scoreboard section -->

        <div class="header">

            <h1>Round</h1>

            <h2>Score</h2>

            <div class="score"></div>

            <div class="score-container">

                <div class="score-p1">0</div>
                <div class="scorep">:</div>
                <div class="scorep2">0</div>

            </div>
        </div>

        <!-- Main section -->

        <div class="container cont1"></div>

        <div class="container cont2"></div>

        
        <!-- Options -->

        <div class="options">

            <div class="option1">
                <img src="./rock.png" alt="Rock Image" class="opt" id="rock">

                <div class="text1">Rock</div>
            </div>
            
            <div class="option2">
                <img src="./paper.png" alt="Paper Image" class="opt" id="paper">

                <div class="text1">Paper</div>
            </div>

            <div class="option3">
                <img src="./scissor.jpg" alt="Scissor Image" class="opt" id="scissor">

                <div class="text1">Scissor</div>
            </div>

        </div>




        <!-- Bottom area -->

        <div class="player">

            <div class="p1-container">

                <div class="img-container">

                    <img src="./p1.jpg" alt="Player 1 Image">

                </div>

                <div class="text">Player 1</div>

            </div>

            <div class="p2-container">

                <div class="img-container">

                    <img src="./bot.png" alt="Bot Image">

                </div>

                <div class="text bot">Bot</div>
                
            </div>


        </div>

        <div class="winning_Text">
            
        </div>





    <script src="./rock.js"></script>
    
</body>
</html>
